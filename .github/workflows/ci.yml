name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older in-progress run (but never a run on main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Runs the unit tests and the scripts/*.test.mjs suite, which includes the
      # crest-html bundle-hash check (Crest.html and the desktop bundle match their source).
      - name: Test
        run: npm test

  # The crest-desktop Python server/handoff tests (stdlib unittest, no third-party deps). They were not run in
  # CI before, so the desktop robustness fixes only had local coverage; this gates them too.
  desktop-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Desktop tests
        working-directory: crest-desktop
        run: python -m unittest discover -s tests
