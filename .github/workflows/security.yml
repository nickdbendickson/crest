name: Security scans

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python scanners
        run: pip install bandit==1.9.4 detect-secrets==1.5.0 semgrep==1.183.0
      - name: Bandit (high severity)
        run: |
          bandit -r . -lll -x ./node_modules,./.git
      - name: Semgrep OSS (fail on ERROR)
        env:
          SEMGREP_SEND_METRICS: "off"
        # use-defused-xml*: defusedxml is not shipped with QGIS; stdlib expat in Python 3.7.1+ does not resolve external entities
        run: >-
          semgrep scan --config p/python --config p/typescript --config p/security-audit --config p/secrets
          --severity ERROR --error --metrics off
          --exclude node_modules --exclude tests --exclude test
          --exclude-rule python.lang.security.use-defused-xml.use-defused-xml
          --exclude-rule python.lang.security.use-defused-xml-parse.use-defused-xml-parse
      - name: Install OSV-Scanner v2.7.0
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          curl -sSfL -o osv.sums https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_SHA256SUMS
          grep ' osv-scanner_linux_amd64$' osv.sums | sed 's/osv-scanner_linux_amd64/osv-scanner/' | sha256sum -c -
          chmod +x osv-scanner
      - name: OSV-Scanner (package-lock.json)
        # Accepted/deferred advisories are listed with reasons in osv-scanner.toml
        run: ./osv-scanner scan --lockfile package-lock.json --config osv-scanner.toml
      - name: Install gitleaks v8.30.1
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o gl.sums https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gl.sums | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gl.tgz/' | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: gitleaks (full history)
        # Allowlist: .gitleaks.toml + .gitleaksignore
        run: ./gitleaks git . --no-banner --redact --config .gitleaks.toml
